name: Build Frontend

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Apenas para testar o build do docker-compose
      # - name: Build with Docker Compose
      #   run: docker compose build

      - name: Autenticar no GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY_2026 }}'

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet

      - name: Build e Push da Imagem React
        run: |
          docker build -t southamerica-east1-docker.pkg.dev/viratech-1010-508115/cadastrocliente-front-repo/frontend:${{ github.sha }} .
          docker push southamerica-east1-docker.pkg.dev/viratech-1010-508115/cadastrocliente-front-repo/frontend:${{ github.sha }}

      - name: Obter credenciais do GKE
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: viratech-cluster-cadastrocliente
          location: southamerica-east1

      - name: Aplicar manifestos Kubernetes
        run: kubectl apply -f k8s/

      - name: Atualizar imagem do Frontend
        run: |
          kubectl set image deployment/cadastrocliente-frontend \
          frontend=southamerica-east1-docker.pkg.dev/viratech-1010-508115/cadastrocliente-front-repo/frontend:${{ github.sha }}

      - name: Aguardar rollout
        run: kubectl rollout status deployment/cadastrocliente-frontend --timeout=120s




